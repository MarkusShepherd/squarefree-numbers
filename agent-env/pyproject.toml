# Python packages for every agent's shell, the same for Claude and Codex.
# Build once (writes uv.lock here; commit it):
#   UV_PROJECT_ENVIRONMENT=~/sqf-runs/agent-venv uv sync --project agent-env
# The driver puts that environment first on each agent's PATH (agent_venv in
# config.json). No build system, so uv installs only the dependencies.
[project]
name = "sqf-agent-env"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "mpmath==1.3.0",
    "sympy==1.14.0",
]
